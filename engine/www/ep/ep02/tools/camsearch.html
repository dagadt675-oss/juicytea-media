<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/three.module.min.js"}}</script>
<style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>
<script type="module">
// Camera search helper (dev only): renders q.cams[f] with the HawaiiStage lab settings q.base, one camera per frame index.
import { HawaiiStage } from '../../../lab/hawaii/hterrain.js';
const P = new URLSearchParams(location.search), W = +P.get('w') || 480, H = +P.get('h') || 270, Q = JSON.parse(P.get('q') || '{}');
const out = document.createElement('canvas'); out.width = W; out.height = H; document.body.appendChild(out); const ox = out.getContext('2d');
let S;
window.ready = (async () => { S = new HawaiiStage(W, H, { samples: 0, heroGrid: [900, 900], skirtGrid: [450, 340] }); await S.load('/lab/hawaii/data'); })();
window.renderFrame = async (f) => {
  const b = Q.base || {}; S.setLook(b.look || 'day'); S.setSun(...(b.sun || [120, 38])); S.setWater(b.water || 'turq'); S.setLevel(b.level ?? -122);
  S.set('foamAmt', b.foam ?? 1); S.set('landSat', b.landSat ?? 0.95);
  S.setCamera(Q.cams[f]); ox.drawImage(S.render(0, 0), 0, 0);
};
window.grabBlob = () => new Promise(r => out.toBlob(r, 'image/jpeg', 0.92));
</script></body></html>
