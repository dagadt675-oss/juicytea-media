<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<script type="importmap">{"imports":{"three":"/three.module.min.js"}}</script>
<style>html,body{margin:0;background:#000}</style></head><body>
<script type="module">
import { Stage, Actor, THREE } from './lib/actors.js';
import { cutawayEarth, llDir, drill, drillDir, LAYERS } from './lib/cutaway.js';
import * as F from './lib/fx.js';
const W=1920,H=1080,FPS=30; const comp=document.createElement('canvas'); comp.width=W; comp.height=H; document.body.appendChild(comp); const cx=comp.getContext('2d');
let st, earth, hero;
window.ready=(async()=>{ await document.fonts.load('400 100px "Bebas Neue"'); await document.fonts.load('700 40px "Barlow Condensed"');
  st=new Stage(W,H,{shadowExtent:5, hemi:1.3, key:2.4});
  earth=await cutawayEarth(st,{radius:3});
  // the cut-planes are defined in the group's local frame, so the wedge rotates with the group; re-orient planes in world after rotation:
  hero=await Actor.create(st,'models/adventurer.glb',{scale:0.35}); hero.root.position.set(0,3.0,0);
  hero.play(0,'Idle').play(1.0,'Interact',{fade:0.2}).play(3.0,'HitRecieve',{fade:0.2,once:true});
})();
window.renderFrame=async(f)=>{ const t=f/FPS;
  const ang = Math.PI/4 + Math.sin(t*0.3)*0.12;
  st.lookFrom([Math.cos(ang)*8.2, 3.6, Math.sin(ang)*8.2],[0,0.4,0],32);
  const q0=new THREE.Quaternion().setFromUnitVectors(llDir(38.5,-98), new THREE.Vector3(0,1,0));
  const qy=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), 0.0);
  earth.userData.shell.quaternion.copy(qy.multiply(q0));
  const p=F.prog(t,1.2,3.4,F.E.inOut); if(t>1.2) drillDir(earth,new THREE.Vector3(0,1,0),p);
  const g=cx.createRadialGradient(W/2,H/2,100,W/2,H/2,H); g.addColorStop(0,'#0c1426'); g.addColorStop(1,'#03050a'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  cx.drawImage(st.render(t),0,0);
  F.post(cx,W,H,f);
};
window.grabBlob=()=>new Promise(r=>comp.toBlob(r,'image/jpeg',0.92));
</script></body></html>
