<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<script type="importmap">{"imports":{"three":"/three.module.min.js"}}</script>
<style>html,body{margin:0;background:#000}</style></head><body>
<script type="module">
import { Stage, THREE } from './lib/actors.js';
import { tetraEarth } from './lib/morph.js';
import * as F from './lib/fx.js';
const W=1920,H=1080,FPS=30; const comp=document.createElement('canvas'); comp.width=W; comp.height=H; document.body.appendChild(comp); const cx=comp.getContext('2d');
let st, te;
window.ready=(async()=>{ st=new Stage(W,H,{shadows:false, hemi:1.4, key:2.2}); te=await tetraEarth(st,{radius:2.2}); })();
window.renderFrame=async(f)=>{ const k=[0,0.5,1][f%3]; te.userData.set(F.E.inOut(k), k);
  te.rotation.y = 0.4 + f*0.6; st.lookFrom([0,-1.5,9.5],[0,-0.2,0],32);
  const g=cx.createRadialGradient(W/2,H/2,100,W/2,H/2,H); g.addColorStop(0,'#0c1426'); g.addColorStop(1,'#03050a'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  cx.drawImage(st.render(f/FPS),0,0); };
window.grabBlob=()=>new Promise(r=>comp.toBlob(r,'image/jpeg',0.92));
</script></body></html>
