<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from './three.module.min.js';
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1920, H = +P.get('h') || 1080, FPS = +P.get('fps') || 30;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// keep GL canvas offscreen; we composite into a 2D canvas
const comp = document.createElement('canvas'); comp.width = W; comp.height = H;
document.body.appendChild(comp);
const cx = comp.getContext('2d', { willReadFrequently: true });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W / H, 0.01, 100);

const loader = new THREE.TextureLoader();
const load = (u) => new Promise(r => loader.load(u, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; r(t); }));

// deterministic RNG
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const sunDir = new THREE.Vector3(1, 0.25, 0.35).normalize();
let earth, atmo;
window.ready = (async () => {
  const [day, night] = await Promise.all([load('tex/day_8k.jpg'), load('tex/night_8k.jpg')]);
  const mat = new THREE.ShaderMaterial({
    uniforms: { dayTex: { value: day }, nightTex: { value: night }, sunDir: { value: sunDir }, camPos: { value: camera.position } },
    vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vW;
      void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `uniform sampler2D dayTex; uniform sampler2D nightTex; uniform vec3 sunDir; uniform vec3 camPos;
      varying vec2 vUv; varying vec3 vN; varying vec3 vW;
      vec3 toLin(vec3 c){ return pow(c, vec3(2.2)); }
      void main(){
        vec3 n=normalize(vN); vec3 v=normalize(camPos-vW);
        float d=dot(n,sunDir);
        vec3 day=texture2D(dayTex,vUv).rgb;
        vec3 night=texture2D(nightTex,vUv).rgb;
        float water = smoothstep(0.05,0.25, day.b-day.r);
        float lit = smoothstep(-0.12,0.35,d);
        vec3 col = day*(0.06+1.05*max(d,0.0));
        // ocean specular
        vec3 h=normalize(sunDir+v); float spec=pow(max(dot(n,h),0.),60.)*water*0.55*lit;
        col += vec3(1.0,0.92,0.8)*spec;
        // city lights on night side
        vec3 lights = night*vec3(1.0,0.78,0.45)*1.6*(1.0-lit);
        col = col + lights;
        // terminator warm tint
        float term = exp(-pow(d*6.0,2.0));
        col += vec3(0.35,0.12,0.02)*term*0.25;
        // atmospheric rim scattering on day side
        float fres = pow(1.0-max(dot(n,v),0.0), 3.0);
        col = mix(col, vec3(0.35,0.6,1.0)*(0.25+lit), fres*0.55);
        gl_FragColor=vec4(col,1.0);
      }`,
  });
  earth = new THREE.Mesh(new THREE.SphereGeometry(1, 256, 128), mat);
  scene.add(earth);
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: { sunDir: { value: sunDir } },
    vertexShader: `varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `uniform vec3 sunDir; varying vec3 vN; varying vec3 vW;
      void main(){ vec3 v=normalize(cameraPosition-vW); float i=pow(0.72-dot(vN,v),3.0); float lit=smoothstep(-0.4,0.6,dot(vN,sunDir));
        gl_FragColor=vec4(vec3(0.3,0.58,1.0)*i*(0.25+1.6*lit),1.0)*1.5; }`,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  });
  atmo = new THREE.Mesh(new THREE.SphereGeometry(1.06, 128, 64), atmoMat);
  scene.add(atmo);
  // stars
  const r = rng(7); const N = 6000; const pos = new Float32Array(N * 3); const col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u); pos.set([40 * s * Math.cos(th), 40 * u, 40 * s * Math.sin(th)], i * 3); const b = Math.pow(r(), 6) * 0.9 + 0.08; col.set([b, b, b * (0.9 + 0.2 * r())], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true })));
  // warm up
  renderer.render(scene, camera);
})();

const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function camAt(lat, lon, dist) {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  // three.js sphere uv: u=0 at lon=-180 → position x = -cos(lo)... map lon to sphere coords
  const x = Math.cos(la) * Math.cos(lo), y = Math.sin(la), z = -Math.cos(la) * Math.sin(lo);
  camera.position.set(x * dist, y * dist, z * dist);
  camera.lookAt(0, 0, 0);
}
window.renderFrame = async (f) => {
  const t = f / FPS;
  const k = ease(Math.min(1, t / 3));
  camAt(20 + 25 * k, 10 - 60 * k, 4.2 - 1.6 * k);
  earth.material.uniforms.camPos.value.copy(camera.position);
  renderer.render(scene, camera);
  cx.drawImage(renderer.domElement, 0, 0);
  cx.font = '600 64px sans-serif'; cx.fillStyle = '#fff'; cx.fillText('Frame ' + f, 80, 120);
};
window.grab = () => new Uint8Array(cx.getImageData(0, 0, W, H).data.buffer);
</script>
</body></html>
