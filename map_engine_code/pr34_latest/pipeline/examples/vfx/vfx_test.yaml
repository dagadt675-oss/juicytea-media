# One silent pass that calls every vfx_core feature. Times are seconds.
id: vfx_core_proof
duration: 18
fps: 30
grade: true
# Map layer only. Captions are drawn after this, so they stay straight.
barrel: true
# Fixed grain, rotated each frame, Overlay at 0.015.
grain: true
# 1/d^2 spill around extruded countries. The impact beat pulses it. No camera shake.
spill: true
# Colourful satellite is the default. Focus mode is one dramatic beat below.
# No depth-of-field blur. The picture stays sharp.
dof: false
words: words.json
camera:
  - {t: 0.0, proj: ortho, lon: 18, lat: 63, span: 100, ease: expo, exp: true}
  - {t: 1.6, proj: ortho, lon: 10, lat: 58, span: 62, ease: expo, exp: true}
  - {t: 3.2, proj: ortho, lon: 22, lat: 66, span: 40, ease: cubic, exp: true}
  - {t: 4.50, proj: merc, lon: 16, lat: 60, span: 24, ease: expo, exp: true}
  # Short snap: spring integrates toward this key, then settles. The next move is a dive.
  - {t: 5.20, proj: merc, lon: 8, lat: 55, span: 14, ease: spring}
  - {t: 6.4, proj: merc, lon: 26, lat: 64, span: 16, ease: cubic, exp: true}
  - {t: 8.0, proj: merc, lon: 12, lat: 58, span: 12, ease: out, exp: true}
  - {t: 9.6, proj: merc, lon: 24, lat: 66, span: 20, ease: cubic, exp: true}
  - {t: 11.2, proj: merc, lon: 14, lat: 59, span: 14, ease: out, exp: true}
  - {t: 12.8, proj: merc, lon: 28, lat: 65, span: 26, ease: cubic, exp: true}
  - {t: 14.4, proj: merc, lon: 16, lat: 60, span: 18, ease: out, exp: true}
  - {t: 16.0, proj: ortho, lon: 20, lat: 62, span: 48, ease: out, exp: true}
  - {t: 18.0, proj: ortho, lon: 12, lat: 58, span: 88, ease: quintic, exp: true}
beats:
  - {t: 0.15, type: atmosphere, name: rim}
  - {t: 0.40, type: clouds, name: cloud-deck}
  - {t: 1.70, type: extrude, name: sweden, iso: SWE, color: [0, 82, 147]}
  - {t: 3.30, type: shadow, name: sun-shadow, iso: SWE}
  - {t: 4.40, type: multiply, name: paper, tint: [214, 186, 140], amount: 0.28}
  - {t: 5.10, type: laser, name: laser-border, dur: 2.4, ink: true, origins: 4}
  - {t: 6.30, type: extrude, name: finland, iso: FIN, color: [186, 220, 236]}
  - {t: 7.20, type: badge, name: badge-market, text: "MÄRKET", x: 540, y: 420}
  - {t: 7.55, type: svg, name: svg-icon, dur: 0.64}
  - {t: 8.50, type: overshoot, name: overshoot-mark, text: "!", x: 540, y: 620}
  - {t: 8.70, type: badge, name: badge-finland, text: "FINLAND", x: 540, y: 420}
  # Three frames. Map only, so the badge does not tear.
  - {t: 9.10, type: glitch, name: glitch-hit, frames: 3}
  # Optional dark accent. The rest of the clip stays the colourful globe.
  - {t: 10.40, type: stress, name: stress-huge, word: HUGE, dur: 0.9, style: focus}
  # Light pulse only. The camera does not shake.
  - {t: 12.40, type: impact, name: impact, dur: 0.25, amp: 0}
  - {t: 14.20, type: laser, name: laser-second, dur: 1.6, ink: true, origins: 3}
  - {t: 15.80, type: clouds, name: cloud-return}
  - {t: 16.90, type: overshoot, name: overshoot-return, text: "!", x: 780, y: 500}
