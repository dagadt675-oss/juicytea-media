# Could every human fit in one US state? Rhode Island's land, standing tight.
format: B
id: crowd_rhode_island
title: "Could every human on Earth fit in one US state?"
status: final
preset: crowd_island
fps: 30
width: 1080
height: 1920
seed: 8

timing:
  hook_hold: 3.0
  duration_sec: 48.0

quantity:
  # UN World Population Prospects 2024, about 8.2 billion. Not the round 8.
  people: 8200000000
  # Census land area. The slate rounds 1,033.81 sq mi to 1,034.
  land_sq_mi: 1034
  stadium: 107601
  # NYC and US totals are the slate's verify-before-script figures.
  nyc: 8800000
  us: 340000000

say:
  person: "Start with one person in an empty field."
  stadium: "Michigan Stadium holds one hundred seven thousand, six hundred and one."
  nyc: "New York City. About eight point eight million. Check the census before you record this line."
  us: "The United States. About three hundred and forty million. Same warning."
  full: "Everyone on Earth. Eight point two billion. The outline is Rhode Island."
  density: "About three people per square meter of land. Concert-crowd tight."
  jump: "Everyone jumps at once. Earth moves less than an atom's width."

sources:
  - id: people
