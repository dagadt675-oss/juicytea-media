  - id: density
    used_for: "8.2 billion divided by that land area is about 3.1 people per square meter. Total area including water is looser, about 2 per square meter."
  - id: stadium
    used_for: "Michigan Stadium capacity 107,601."
    url: "https://mgoblue.com/sports/2017/6/16/facilities-michigan-stadium-html"
