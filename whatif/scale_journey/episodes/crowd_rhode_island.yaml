    used_for: "Everybody jump, gathered in Rhode Island. Earth moves less than an atom's width."
    url: "https://what-if.xkcd.com/8/"
  - id: nyc-us
    used_for: "8.8 million and 340 million are the slate's placeholders. Pull a fresh census figure before scripting."
  - id: instancer
