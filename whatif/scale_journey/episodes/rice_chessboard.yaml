# Rice on a chessboard. Every square doubles. The heap is instanced.
# The camera, not the heap, is what reaches orbit. The heap is a few kilometres tall.
format: B
id: rice_chessboard
title: "What if you filled a chessboard by doubling the rice?"
status: final
preset: rice_chessboard
fps: 30
width: 1080
height: 1920
seed: 11

timing:
  hook_hold: 2.4
  duration_sec: 36.0

quantity:
  squares: 64
  grain_mass_kg: 0.000021
  bulk_density_kg_m3: 800
  repose_deg: 34
  # Camera altitude for the last beat. ISS is about 408 km. The heap is not that tall.
  camera_altitude_m: 408000

say:
  first: "One grain on the first square."
  square32: "Square thirty-two is still a small heap. The last squares are the whole story."
  last: "Square sixty-four. The heap of every square together."
  orbit: "Pull back to orbit. The heap is a mountain, not a moon."

sources:
  - id: chessboard
    used_for: "Square n gets 2^(n-1) grains. All 64 squares are 2^64 − 1 grains."
  - id: density
    used_for: "Bulk density 800 kg/m3, inside FAO's 0.78–0.85 g/ml for milled rice."
    url: "https://www.fao.org/4/t0567e/T0567E08.htm"
  - id: kernel
    used_for: "21 mg per grain, a representative thousand-kernel weight of 21 g. Not a USDA grade constant."
  - id: orbit
    used_for: "Camera at 408 km, a typical ISS altitude. The heap height is computed from the cone, and it is far shorter."
  - id: instancer
    used_for: "The picture instances a few thousand grains inside the true cone. The counter shows 2^64 − 1."
