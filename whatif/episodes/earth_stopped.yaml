# Format C. Real seconds, locked street camera, loopable.
# Twist: the ground stops and the street does not. The ocean arrives.
# Then the spin returns and the count is back at five, so the shot can loop.
id: earth_stopped
title: "What if the Earth stopped spinning?"
status: stub
format: C
fps: 30
width: 1080
height: 1920
population: 8300678396
scene:
  pieces: [terrain, city, river, bridge, suburbs, forest]
  seed: 11
camera:
  # Street level, locked. The bridge and towers stay in frame.
  location: [2.5, -14.5, 1.8]
  target: [6.5, 4.0, 2.4]
  lens: 28
  sensor_fit: VERTICAL
  sensor_height: 24
beats:
  - id: five
    title: true
    seconds: 1.6
    time_label: "5"
    ticker: "5"
    narration: "Five."
    channels:
      critical: 0.05
  - id: four
    seconds: 1.0
    time_label: "4"
    narration: "Four."
    channels:
      critical: 0.15
  - id: three
    seconds: 1.0
    time_label: "3"
    narration: "Three."
    channels:
      critical: 0.28
  - id: two
    seconds: 1.0
    time_label: "2"
    narration: "Two."
    channels:
      critical: 0.45
      wind: 0.2
  - id: one
    seconds: 1.0
    time_label: "1"
    narration: "One."
    channels:
      critical: 0.62
      wind: 0.45
  - id: stop
    seconds: 2.4
    time_label: "0"
    narration: "The ground stops. The street does not."
    channels:
      inertia: 0.85
      fracture: 0.35
      critical: 0.8
      wind: 0.9
