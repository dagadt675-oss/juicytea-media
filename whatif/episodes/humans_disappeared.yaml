id: humans_disappeared
title: "What if every human vanished… right now?"
status: final
fps: 30
width: 1080
height: 1920
# UN World Population Prospects 2024: about 8.2 billion in 2024.
# https://www.un.org/development/desa/pd/world-population-prospects-2024
population: 8200000000
scene:
  pieces: [terrain, city, river, bridge, suburbs, forest, power, subway]
  terrain: city_park
  seed: 11
format: A
camera:
  # Solved against the zenith frame: skyline base 38%, near bank 55%,
  # promenade 77%, tower x 62%, tower top 13%.
  location: [-38.0, -25.3, 58.3]
  target: [2.5, 125.85, -11.0]
  lens: 57.2
  sensor_fit: HORIZONTAL
  sensor_width: 36
  clip_end: 2500
ui:
  counter_y: 0.46
  # Zenith style: the title, and one counter (population, then the year).
  text: [title, counter]
# Sound effects only. The beat lines time the picture; they are not spoken.
audio:
  narration: false
  music: false
  sfx: true
beats:
  - id: vanish
    title: true
    counter: {mode: population}
    narration: "Every person on Earth disappears at once."
    channels:
      vanish:
        - {u: 0.0, v: 0.0}
        - {u: 0.45, v: 0.72}
        - {u: 1.0, v: 1.0}

  - id: power
    time_label: "+1 HOUR"
    ticker: "+1 HOUR"
    narration: "Almost at once, the power fails, and the city lights go dark."
    channels:
      day_night:
        - {u: 0.0, v: 0.16}
        - {u: 0.42, v: 0.74}
        - {u: 1.0, v: 0.80}
      power:
        - {u: 0.0, v: 0.0}
        - {u: 0.30, v: 1.0}
        - {u: 0.62, v: 1.0}
        - {u: 1.0, v: 0.0}
      power_grid:
        - {u: 0.0, v: 1.0}
        - {u: 0.55, v: 0.15}
        - {u: 1.0, v: 0.0}

  - id: flood
    time_label: "+2 DAYS"
    ticker: "+2 DAYS"
    narration: "Within about two days, the subways flood without their pumps."
    channels:
      day_night:
        - {u: 0.0, v: 0.80}
        - {u: 0.45, v: 0.20}
        - {u: 1.0, v: 0.16}
      flood: 0.72
      wet: 0.75

  - id: weeds
    time_label: "1 YEAR"
    ticker: "1 YEAR"
    narration: "In a matter of months, the pavement cracks, and weeds follow."
    channels:
      vegetation: 0.30
      rust: 0.06
      flood: 0.62
      wet: 0.55

  - id: streets
    time_label: "20 YEARS"
    ticker: "20 YEARS"
    narration: "Within about twenty years, flooded streets can begin to cave in."
    channels:
      collapse: 0.18
      vegetation: 0.46
      rust: 0.16
      flood: 0.68

  - id: houses
    time_label: "50 YEARS"
    ticker: "50 YEARS"
    narration: "Over the following decades, many wooden houses fall apart."
    channels:
      collapse: 0.40
      vegetation: 0.62
      rust: 0.30

  - id: towers
    time_label: "100 YEARS"
    ticker: "100 YEARS"
    narration: "As centuries pass, rust can bring the steel towers down."
    channels:
      collapse: 0.68
      rust: 0.62
      vegetation: 0.78
      sag: 0.35

  - id: bridge
    time_label: "300 YEARS"
    ticker: "300 YEARS"
    narration: "A few centuries on, the great suspension bridges collapse."
    channels:
      collapse: 1.0
      rust: 0.88
      vegetation: 0.9
      sag: 0.6

  - id: forest
    time_label: "500 YEARS"
    ticker: "500 YEARS"
    narration: "Within about five centuries, neighborhoods turn back into forest."
    channels:
      vegetation: 1.0
      rust: 1.0
      collapse: 1.0

  - id: relics
    time_label: "10,000 YEARS"
    ticker: "10,000 YEARS"
    narration: "Plastic and bronze can outlast every fallen building."
    channels:
      vegetation: 1.0
      day_night:
        - {u: 0.0, v: 0.16}
        - {u: 1.0, v: 0.30}

  - id: seam
    time_label: "10 MILLION YEARS"
    ticker: "10 MILLION YEARS"
    narration: "Copper may remain only as a thin red seam in the rock."
    channels:
      ice:
        - {u: 0.0, v: 0.0}
        - {u: 0.30, v: 1.0}
        - {u: 0.58, v: 0.7}
        - {u: 1.0, v: 0.0}
      snow:
        - {u: 0.0, v: 0.0}
        - {u: 0.30, v: 1.0}
        - {u: 0.62, v: 0.25}
        - {u: 1.0, v: 0.0}
      vegetation:
        - {u: 0.0, v: 1.0}
        - {u: 0.28, v: 0.35}
        - {u: 1.0, v: 0.8}
      geology:
        - {u: 0.0, v: 0.0}
        - {u: 0.34, v: 0.0}
        - {u: 1.0, v: 1.0}

  - id: return
    title: true
    reset: true
    counter: {mode: population}
    narration: "Then the lights return, and the city is whole again."
