back: &back {proj: merc, lon: -100, lat: 45, span: 140, cut: true}

grid: &grid {type: graticule}
lakes_cut: &lakes_cut {type: lakes}
can: &can {type: highlight, countries: [CAN], colors: ["#E82247"]}
