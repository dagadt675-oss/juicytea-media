south: &south {type: tag, text: "CANADA'S SOUTHERNMOST POINT", pill: yellow, x: 0.50, y: 0.24}
chi: &chi {type: marker, lat: 41.878, lon: -87.630, label: "CHICAGO", pill: white, radar: drop}
chi_lat: &chi_lat {type: marker, lat: 41.878, lon: -87.630, label: "CHICAGO 41.88°N", pill: white, radar: drop}
