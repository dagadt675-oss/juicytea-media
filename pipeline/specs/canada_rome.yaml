# Silent picture of the gold Canada Short. Karaoke is not burned in.
# The words below are the on-screen karaoke, one card per beat.
# Measured from the 1080 file: pipeline/style/gold_canada.md
id: canada_rome
title: "Part of Canada Is Further South Than Chicago?"
theme: midnight
notes: "Gold-file proof. One opening push, then eases and cuts. No sway. Karaoke y 0.62–0.67 is left empty."
voice:
  engine: silent
  enforce_pauses: false
  draw_claims: false
tags: ["#shorts", "#maps", "#canada"]
sources:
  - "Middle Island, Lake Erie: 41.6814°N, southernmost land in Canada"
  - "Chicago: 41.878°N"
  - "California's northern border: 42°N"
  - "Rome: 41.893°N"
description: |
  Part of Canada is further south than Chicago?

  Middle Island in Lake Erie is the southernmost point of Canada. A line west puts it south of Chicago and south of California's entire northern border. East across the Atlantic, it is south of Rome.

  Silent picture. No burned-in karaoke. Leave y 0.64–0.72 empty for captions.

  #shorts #maps #canada

wide: &wide {proj: merc, lon: -100, lat: 45, span: 90}
lakes: &lakes {proj: merc, lon: -84, lat: 42.6, span: 26, cut: true}
erie: &erie {proj: merc, lon: -82.6, lat: 41.4, span: 13, cut: true}
usa: &usa {proj: merc, lon: -104, lat: 38, span: 66, cut: true}
atl: &atl {proj: merc, lon: -18, lat: 38, span: 80, cut: true}
