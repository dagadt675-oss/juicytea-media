# Silent picture for the US LA–Tokyo read. Durations below are placeholders.
# Replace them from words.json before the timed render. Do not ship this clock.
id: lax_tokyo
title: "Why LA→Tokyo curves toward Alaska"
theme: midnight
notes: "Six scenes, provisional durations. No camera sway. Karaoke band y 0.64–0.72 stays empty. The arc bends toward Alaska; it does not fly over Alaska, and the film never says the flight is exactly the great circle."
voice:
  engine: silent
  enforce_pauses: false
  draw_claims: false
tags: ["#shorts", "#maps", "#flights"]
sources:
  - "LAX and Narita published airport positions, used only as the pin locations"
  - "Spherical geometry: the great circle is about 480 km (about 300 mi) shorter than the Mercator rhumb"
description: |
  Your flight from LA to Tokyo curves up toward Alaska.

  And that curve is about three hundred miles shorter. Why? Because your flat map is lying. On a Mercator map, the straight line looks shortest. But Earth is a sphere, and the real shortest path is a great circle that bends north. So next time your flight tracker curves north... it's not a mistake.

  Silent picture. No burned-in karaoke. Fit the voice to timeline.json once words.json arrives. Keep captions inside y 0.64–0.72.

  #shorts #maps #flights
lax: &lax [33.9425, -118.4081]
nrt: &nrt [35.7720, 140.3929]
cam: &cam {proj: merc, lon: -160, lat: 44, span: 150}
back: &back {proj: merc, lon: -160, lat: 44, span: 150, cut: true}
lie: &lie {type: tag, text: "YOUR MAP IS LYING", x: 0.50, y: 0.20, pill: red, band: top, size: 42}
lakes: &lakes {type: lakes}
la: &la {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
tyo: &tyo {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
arc: &arc {type: route, mode: great, style: solid, a: *lax, b: *nrt, from: 0.62, draw: 1.15}
held: &held {type: route, mode: great, style: solid, a: *lax, b: *nrt, grow: false}
