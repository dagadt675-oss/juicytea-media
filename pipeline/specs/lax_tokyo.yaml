# Silent picture timed to the ElevenLabs read. No voice is generated here.
# On-screen titles are the spoken sentences. The arc bends north at 15.5 s.
id: lax_tokyo
title: "Why LA→Tokyo curves toward Alaska"
theme: midnight
notes: "Silent 1080×1920. No camera sway. Karaoke band y 0.64–0.72 stays empty."
voice:
  engine: silent
  enforce_pauses: false
tags: ["#shorts", "#maps", "#flights"]
sources:
  - "LAX and Narita published airport positions, used only as the pin locations"
  - "Spherical geometry: the great circle bends north of the Mercator rhumb"
description: |
  Why does your flight from LA to Tokyo curve toward Alaska?

  Because your flat map is lying. On a Mercator map, the straight line looks shortest. But Earth is a sphere. The real shortest path is a great circle, and it bends north, toward Alaska. That saves hundreds of kilometers. So next time your flight tracker curves north... it's not a mistake.

  Silent picture. No burned-in karaoke. Fit the voice to timeline.json. Keep captions inside y 0.64–0.72.

  #shorts #maps #flights
lax: &lax [33.9425, -118.4081]
nrt: &nrt [35.7720, 140.3929]
cam: &cam {proj: merc, lon: -160, lat: 44, span: 150}
lines:
  - text: "Why does your flight from LA to Tokyo curve toward Alaska?"
    kind: q
    dur: 4.10
    claim: "Why does your flight\nfrom LA to Tokyo\ncurve toward *Alaska?*"
    sub: ""
    camera: *cam
    visuals:
      - {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
      - {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
      - {type: route, mode: rhumb, style: solid, a: *lax, b: *nrt}

  - text: "Because your flat map is lying."
    kind: s
    dur: 2.77
    claim: "Because your flat map\nis *lying.*"
    sub: ""
    camera: *cam
    visuals:
      - {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
      - {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
      - {type: route, mode: rhumb, style: dashed, a: *lax, b: *nrt}

  - text: "On a Mercator map, the straight line looks shortest."
    kind: s
    dur: 3.54
    claim: "On a Mercator map,\nthe straight line\nlooks *shortest.*"
    sub: ""
    camera: *cam
    visuals:
      - {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
      - {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
      - {type: route, mode: rhumb, style: solid, a: *lax, b: *nrt}

  - text: "But Earth is a sphere."
    kind: s
    dur: 2.01
    claim: "But Earth is\na *sphere.*"
    sub: ""
    camera: *cam
    visuals:
      - {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
      - {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
      - {type: route, mode: rhumb, style: solid, a: *lax, b: *nrt}

  - text: "The real shortest path is a great circle, and it bends north, toward Alaska."
    kind: s
    dur: 5.41
    claim: "The real shortest path\nis a great circle,\nand it bends *north,*\ntoward Alaska."
    sub: ""
    camera: *cam
    visuals:
      - {type: highlight, countries: [USA]}
      - {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
      - {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
      - {type: route, mode: morph, bend_at: 15.5, bend_end: 16.9, label: "TOWARD ALASKA", a: *lax, b: *nrt}

  - text: "That saves hundreds of kilometers."
    kind: s
    dur: 2.59
    claim: "That saves *hundreds*\nof kilometers."
    sub: ""
    camera: *cam
    visuals:
      - {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
      - {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
      - {type: route, mode: great, style: solid, a: *lax, b: *nrt}

  - text: "So next time your flight tracker curves north..."
    kind: s
    dur: 2.92
    claim: "So next time your\nflight tracker\ncurves *north...*"
    sub: ""
    camera: *cam
    visuals:
      - {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
      - {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
      - {type: route, mode: great, style: solid, a: *lax, b: *nrt}

  - text: "it's not a mistake."
    kind: p
    dur: 1.16
    claim: "it's not a *mistake.*"
    sub: ""
    camera: *cam
    visuals:
      - {type: marker, lat: 33.9425, lon: -118.4081, label: "LA"}
      - {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO"}
      - {type: route, mode: great, style: solid, a: *lax, b: *nrt}
