# Silent picture timed to the US LA–Tokyo read.
# Sentence starts: 0.03, 3.93, 7.24, 8.14, 10.81, 14.28, 20.25, 23.05. Picture ends at 24.20.
# words.json: "three" 5.488, "hundred" 5.755, "miles" 6.022–6.277.
# The pill springs in at 5.35 so it is up on that phrase.
# "bends" 19.114–19.346, "north" 19.415–19.903. The path lifts across 18.80–19.75.
id: lax_tokyo
title: "Why LA→Tokyo curves toward Alaska"
theme: midnight
notes: "Eight sentences, 24.2 s. No camera sway. Karaoke band y 0.64–0.72 stays empty. The arc bends toward Alaska; the film does not say the flight flies over Alaska or flies exactly the great circle."
voice:
  engine: silent
  enforce_pauses: false
  draw_claims: false
  lead: 0.03
tags: ["#shorts", "#maps", "#flights"]
sources:
  - "LAX and Narita published airport positions, used only as the pin locations"
  - "Spherical geometry: the great circle is about 480 km (about 300 mi) shorter than the Mercator rhumb"
description: |
  Your flight from LA to Tokyo curves up toward Alaska.

  And that curve is about three hundred miles shorter. Why? Because your flat map is lying. On a Mercator map, the straight line looks shortest. But Earth is a sphere, and the real shortest path is a great circle that bends north. So next time your flight tracker curves north... it's not a mistake.

  Silent picture. No burned-in karaoke. The voice fits timeline.json. Keep captions inside y 0.64–0.72.

  #shorts #maps #flights
lax: &lax [33.9425, -118.4081]
nrt: &nrt [35.7720, 140.3929]
cam: &cam {proj: merc, lon: -160, lat: 44, span: 150, push: 1.28, creep: 0.05}
back: &back {proj: merc, lon: -160, lat: 44, span: 150, cut: true, creep: 0.05}
wait: &wait {type: tag, text: "WAIT...", x: 0.50, y: 0.168, pill: white, band: top, size: 26, head: 0.55, until: 1.55, tight: true}
lie: &lie {type: tag, text: "YOUR MAP IS LYING", x: 0.50, y: 0.20, pill: red, band: top, size: 42, head: 0.45, until: 1.55}
lying: &lying {type: tag, text: "YOUR MAP IS LYING", x: 0.50, y: 0.20, pill: red, band: top, size: 42}
lakes: &lakes {type: lakes}
la: &la {type: marker, lat: 33.9425, lon: -118.4081, label: "LA", radar: steady, side: right}
tyo: &tyo {type: marker, lat: 35.7720, lon: 140.3929, label: "TOKYO", radar: steady, side: left}
arc: &arc {type: route, mode: great, style: solid, a: *lax, b: *nrt, from: 0.62, draw: 1.15}
held: &held {type: route, mode: great, style: solid, a: *lax, b: *nrt, grow: false}
glow: &glow {type: route, mode: great, style: solid, a: *lax, b: *nrt, grow: false, glow: true}
plane: &plane {type: plane, a: *lax, b: *nrt, u0: 0.28, u1: 0.86, dur: 24.2, straight_from: 10.81, straight_until: 18.80, bend_end: 19.75}
